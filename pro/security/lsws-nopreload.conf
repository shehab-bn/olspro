# OLS PRO shimguard (ROADMAP G10): never hand an LD_PRELOAD/LD_AUDIT shim to lshttpd.
# Install as /etc/systemd/system/lshttpd.service.d/50-olspro-nopreload.conf
# (same for lsws.service / openlitespeed.service if present), then
# `systemctl daemon-reload`. 'olspro-shimguard fix' does this for you.
# Note: this only covers Environment=/EnvironmentFile=/manager env. It does
# NOT cover /etc/ld.so.preload or an LD_PRELOAD exported by a tampered
# bin/lswsctrl or bin/lsws_env; olspro-shimguard check/fix handles those.
# systemd < 235 (CentOS/CloudLinux 7) ignores UnsetEnvironment=; there
# 'olspro-shimguard fix' installs 'Environment=LD_PRELOAD= LD_AUDIT=' instead.
[Service]
UnsetEnvironment=LD_PRELOAD LD_AUDIT
