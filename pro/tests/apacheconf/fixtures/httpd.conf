# cPanel EA4 style fixture (shape mirrors what WHM's rebuildhttpdconf writes)
ServerRoot "/etc/apache2"
Define LOGDIR /var/log/apache2
Listen 0.0.0.0:80
Listen [::]:80
Listen 0.0.0.0:443
ServerName web.example.net
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
Include "conf.d/*.conf"

<VirtualHost 203.0.113.9:80>
    ServerName example.com
    ServerAlias www.example.com mail.example.com
    DocumentRoot /home/exuser/public_html
    ServerAdmin webmaster@example.com
    <IfModule userdir_module>
        UserDir disabled
    </IfModule>
    <IfModule mod_suexec.c>
        SuexecUserGroup exuser exuser
    </IfModule>
    CustomLog /var/log/apache2/domlogs/example.com combined
    ErrorLog /var/log/apache2/domlogs/example.com-error_log
    Redirect permanent /old-blog https://blog.example.com/
    <IfModule proxy_fcgi_module>
        <FilesMatch \.(phtml|php[0-9]*)$>
            SetHandler "proxy:unix:/opt/cpanel/ea-php82/root/usr/var/run/php-fpm/abc123.sock|fcgi://example.com"
        </FilesMatch>
    </IfModule>
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteCond %{REQUEST_URI} !^/\.well-known/(acme-challenge|pki-validation|cpanel-dcv)/
    RewriteRule ^/?(.*)$ https://example.com/$1 [R=301,L]
    Include "conf.d/userdata/std/2_4/exuser/example.com/*.conf"
</VirtualHost>

<VirtualHost 203.0.113.9:443>
    ServerName example.com
    ServerAlias www.example.com
    DocumentRoot /home/exuser/public_html
    SuexecUserGroup exuser exuser
    SSLEngine on
    SSLCertificateFile /var/cpanel/ssl/installed/certs/example_com_abc.crt
    SSLCertificateKeyFile /var/cpanel/ssl/installed/keys/abc.key
    SSLCertificateChainFile /var/cpanel/ssl/installed/cabundles/abc.cab
    <FilesMatch \.(phtml|php[0-9]*)$>
        SetHandler "proxy:unix:/opt/cpanel/ea-php82/root/usr/var/run/php-fpm/abc123.sock|fcgi://example.com"
    </FilesMatch>
    <Directory "/home/exuser/public_html">
        Options -Indexes
        AllowOverride All
    </Directory>
    SomeVendorDirective on
</VirtualHost>

<VirtualHost *:80>
    ServerName cpanel.example.com
    ServerAlias webmail.example.com whm.example.com
    DocumentRoot /usr/local/apache/htdocs
    ProxyPass "/" "http://127.0.0.1:2082/" 
    <IfModule !mod_missing.c>
        Header set X-Never "1"
    </IfModule>
</VirtualHost>
